 {name:'昇平戯院',title:'昇平戯院',intro:'昇平戯院は昔の映画館です。九份の昔の文化や映画の歴史を感じることができます。',q:'昇平戯院は昔、何をする場所でしたか？',choices:['映画を見る場所','泳ぐ場所','野菜を売る場所'],correct:0,hint:'大きなスクリーンで物語を見る場所です。',speech:'昇平戯院は昔の映画館です。昔の映画や九份の文化を感じてみましょう。',word:'えいが',cn:'電影'},
 {name:'阿妹茶楼',title:'阿妹茶楼',intro:'阿妹茶楼は九份で有名なお茶屋さんです。伝統的な建物と提灯がとてもきれいです。',q:'阿妹茶楼で楽しめるものは何ですか？',choices:['お茶を飲む','スキーをする','飛行機に乗る'],correct:0,hint:'香りのよい飲み物をゆっくり味わいます。',speech:'阿妹茶楼は有名なお茶屋さんです。お茶を飲みながら景色や建物を楽しめます。',word:'おちゃ',cn:'茶'},
 {name:'豎崎路',title:'豎崎路',intro:'豎崎路は石段が続く細い道です。提灯や古い建物があり、写真を撮るのに人気です。',q:'豎崎路の特徴は何ですか？',choices:['石段がある道','広い高速道路','空港の滑走路'],correct:0,hint:'上り下りするとき、足元に気をつけて歩きます。',speech:'豎崎路は石段が続く小道です。提灯や古い町並みを見ながら歩きましょう。',word:'いしだん',cn:'石階'},
 {name:'九份観景台',title:'九份観景台',intro:'九份観景台からは海や山、町の景色を見ることができます。晴れた日は遠くまで見渡せます。',q:'九份観景台から何を見ることができますか？',choices:['海と町の景色','地下鉄の車内','動物園の檻'],correct:0,hint:'高い場所から遠くの景色を眺めます。',speech:'九份観景台からは海と山、九份の町を眺めることができます。きれいな景色を楽しんでね。',word:'けしき',cn:'景色'}
];
let score=0,active=-1,completed=Array(5).fill(false),soundOn=true,answered=false;const $=id=>document.getElementById(id);
function tone(freq=660,duration=.12){if(!soundOn)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration);setTimeout(()=>c.close(),duration*1000+100);}catch(e){}}
function toggleSound(){soundOn=!soundOn;document.querySelector('.gear').textContent=soundOn?'🔊':'🔇';if(soundOn)tone(500)}
function speak(text){if(!soundOn||!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.88;u.pitch=1.05;speechSynthesis.speak(u)}
function speakCurrent(){if(active>=0)speak(spots[active].speech+' '+spots[active].q)}
function startSpot(i){if(i!==0&&!completed[i-1])return;if(completed[i])return;active=i;answered=false;
 document.querySelectorAll('.spot').forEach(b=>b.classList.remove('current'));document.querySelectorAll('.spot')[i].classList.add('current');
 const pos=[[31,31],[48,36],[64,26],[78,35],[92,42]][i];
 $('panel').classList.remove('show');$('hint').classList.remove('show');$('next').classList.remove('show');$('notice').textContent='';
 $('girl').classList.add('walking');$('girl').style.left=Math.max(2,Math.min(pos[0]-3,94))+'%';$('girl').style.top=(pos[1]+12)+'%';
 $('bubble').innerHTML='次の場所へ歩いているよ！';tone(740);
 setTimeout(()=>{
  $('girl').classList.remove('walking');$('bubble').innerHTML=spots[i].name+'に到着！';
  $('placeTitle').textContent=spots[i].title+'！';$('intro').textContent=spots[i].intro;
  $('question').textContent=spots[i].q;$('word').textContent=spots[i].word+'（'+spots[i].cn+'）';
  $('answers').innerHTML='';spots[i].choices.forEach((ch,k)=>{let btn=document.createElement('button');btn.className='answer';btn.innerHTML=['①','②','③'][k]+'　'+ch;btn.onclick=()=>answer(k);$('answers').appendChild(btn)});
  $('panel').classList.add('show');$('hint').classList.add('show');
  setTimeout(()=>speak(spots[i].speech),250);
 },1750);
}
function answer(k){if(answered)return;if(k===spots[active].correct){answered=true;score+=20;$('scoreValue').textContent=score;completed[active]=true;$('notice').textContent='正解！スタンプをゲット！ 🎉';$('answers').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===k)b.style.background='#d5f1c2'});$('next').classList.add('show');$('hint').classList.remove('show');$('st'+active).textContent='⭐';document.querySelectorAll('.spot')[active].classList.add('done');tone(950,.2);setTimeout(()=>tone(1200,.25),160);if(active===4){$('next').textContent='旅を完成する！ ➜';setTimeout(()=>finish(),1200);}else{setTimeout(()=>{ $('panel').classList.remove('show');$('hint').classList.remove('show');$('bubble').innerHTML='地図に戻って次の場所へ！';let n=active+1;document.querySelectorAll('.spot')[n].classList.remove('locked');document.querySelectorAll('.spot')[n].textContent=spots[n].name;startSpot(n);},1100);}}else{$('notice').textContent='残念！もう一度考えてみよう。';tone(240);}}
function showHint(){if(active>=0){$('notice').textContent='ヒント：'+spots[active].hint;speak(spots[active].hint)}}
function nextSpot(){if(active===4){finish();return}let next=active+1;document.querySelectorAll('.spot')[next].classList.remove('locked');document.querySelectorAll('.spot')[next].textContent=spots[next].name;startSpot(next)}
function finish(){$('panel').classList.remove('show');$('hint').classList.remove('show');$('finish').classList.add('show');$('finalScore').textContent='スコア：'+score+' / 100';speak('旅行完成！おめでとう！九份の旅、おつかれさまでした。');tone(880);setTimeout(()=>tone(1100,.2),180);setTimeout(()=>tone(1320,.25),380)}
function restart(){score=0;active=-1;completed=Array(5).fill(false);$('scoreValue').textContent='0';$('finish').classList.remove('show');$('panel').classList.remove('show');$('hint').classList.remove('show');$('girl').style.left='9%';$('girl').style.top='49%';$('bubble').innerHTML='こんにちは！<br>ここは九份老街です！';document.querySelectorAll('.spot').forEach((b,i)=>{b.classList.remove('done','current');if(i)b.classList.add('locked');else b.classList.add('current');b.textContent=spots[i].name});for(let i=0;i<5;i++)$('st'+i).textContent='';$('next').textContent='つぎへ ➜';tone(440)}
</script></body></html>
